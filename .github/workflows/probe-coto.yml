name: Probe Cottage Grove outflow (temporary)

# Diagnostic round 2: verify the USGS gages directly below each dam (site names, live discharge). Dev branch only.
on:
  push:
    branches: [claude/hourly-pool-data-retrieval-1m4bt8]
    paths: ['.github/workflows/probe-coto.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        shell: bash
        run: |
          curl -sS -m 40 "https://waterservices.usgs.gov/nwis/iv/?format=json&sites=14145500,14150000,14151000,14159500,14162200,14153500,14155500,14187200,14169000,14166500&parameterCd=00060&period=PT3H&siteStatus=all" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for ts in d['value']['timeSeries']:
            v=ts['values'][0]['value']
            print(ts['sourceInfo']['siteCode'][0]['value'], '|', ts['sourceInfo']['siteName'], '|', len(v), 'pts | last', (v[-1]['dateTime'], v[-1]['value']) if v else None)"
