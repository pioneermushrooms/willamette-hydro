name: Probe outage sources (temporary)

# One-off discovery job (round 2): data fields, CORS and samples for the outage feeds found in round 1.
# Runs only on the dev branch; removed before anything is merged to main.
on:
  push:
    branches: [claude/hourly-pool-data-retrieval-1m4bt8]
    paths: ['.github/workflows/probe-outages.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        shell: bash
        run: |
          set +e +o pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36'
          echo "########## round 3: NISC full summary + config, coordinate scheme"
          for slug in epud laneelectric; do
            echo "=== $slug summary"; curl -sS -m 25 "https://outagemap-data.cloud.coop/$slug/Hosted_Outage_Map/summary.json" | head -c 4200; echo
            echo "=== $slug config (map/extent keys)"; curl -sS -m 25 "https://outagemap-data.cloud.coop/$slug/Hosted_Outage_Map/config.json" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          def walk(o,p=''):
            if isinstance(o,dict):
              for k,v in o.items():
                if k in ('logo',): continue
                walk(v,p+'.'+k)
            elif isinstance(o,list) and o and not isinstance(o[0],(dict,list)): print(p,o[:6])
            elif isinstance(o,list):
              for i,v in enumerate(o[:3]): walk(v,p+'[%d]'%i)
            else:
              if any(w in p.lower() for w in ('extent','spatial','region','zoom','center','boundary','coord','proj')): print(p,o)
          walk(d)"
          done
          echo "=== NISC app: how outage x/y are placed"
          curl -sS -m 25 -A "$UA" https://epud.outagemap.coop/main.aae40e3a65bf642f.js -o /tmp/m.js; wc -c /tmp/m.js
          grep -oE '.{160}(boundaryExtent|outageExtent|\.x\+|xmin\+|fullExtent).{200}' /tmp/m.js | head -8
          echo "=== BPA DIR CORS headers"
          curl -sS -m 25 -A "$UA" -H 'Origin: https://pioneermushrooms.github.io' -D - -o /dev/null https://transmission.bpa.gov/Business/Operations/Outages/DIR/Fri.HTM | tr -d '\r' | grep -iE '^(HTTP/|access-control|content-type|last-modified)'
