name: Probe outage sources (temporary)

# Round 4: run the new outage code against the live sources. Dev branch only; removed before merge.
on:
  push:
    branches: [claude/hourly-pool-data-retrieval-1m4bt8]
    paths: ['.github/workflows/probe-outages.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: BPA transmission interruptions (local rows)
        run: node scripts/fetch-bpa-outages.js --stdout | head -c 6000
      - name: Live utility outages through js/outages.js
        run: |
          node -e "
          global.self = global; const H = require('./js/data.js'); const O = require('./js/outages.js');
          O.load({ bpaUrl: 'https://raw.githubusercontent.com/pioneermushrooms/willamette-hydro/main/data/bpa.json' }).then((r) => {
            r.utilities.forEach((u) => console.log(u.name, u.error ? 'ERROR ' + u.error : ('out ' + u.out + ' of ' + u.served + ', incidents ' + u.incidents.length + ', regions ' + JSON.stringify(u.regions) + '\n  sample ' + JSON.stringify(u.incidents.slice(0, 3)))));
            const s = O.status(r.utilities, []); console.log('STATUS', s.level, 'customers out', s.out, 'worst', JSON.stringify(s.worst));
          }, (e) => { console.error('load failed', e); process.exit(1); });
          "
