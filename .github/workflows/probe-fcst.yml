name: Probe inflow forecasts (temporary)

# Diagnostic: which reservoir inflow forecast series CWMS publishes per project, how far ahead, how often issued.
on:
  push:
    branches: [claude/hourly-pool-data-retrieval-1m4bt8]
    paths: ['.github/workflows/probe-fcst.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, datetime
          now = datetime.datetime.now(datetime.UTC)
          H = {'Accept': 'application/json;version=2', 'User-Agent': 'probe'}
          def get(u, h=H):
            return json.load(urllib.request.urlopen(urllib.request.Request(u, headers=h), timeout=40))
          for code in ['HCR','LOP','DEX','FAL','GPR','CGR','BLU','FRN','COT','DOR']:
            try:
              cat = get('https://cwms-data.usace.army.mil/cwms-data/catalog/TIMESERIES?office=NWDP&page-size=100&like=' + urllib.parse.quote(code + r'\.Flow-In\..*FCST.*'))
              names = [e['name'] for e in cat.get('entries', [])]
            except Exception as e:
              names = []; print(code, 'catalog error', e)
            print('==', code, names)
            for n in names:
              B = (now - datetime.timedelta(days=2)).strftime('%Y-%m-%dT%H:%M:%SZ'); E = (now + datetime.timedelta(days=12)).strftime('%Y-%m-%dT%H:%M:%SZ')
              try:
                d = get('https://cwms-data.usace.army.mil/cwms-data/timeseries?office=NWDP&unit=EN&page-size=5000&begin=%s&end=%s&name=%s' % (B, E, urllib.parse.quote(n)))
                v = [x for x in d.get('values', []) if x[1] is not None]
                fut = [x for x in v if x[0] > now.timestamp()*1000]
                f = lambda x: datetime.datetime.fromtimestamp(x[0]/1000, datetime.UTC).strftime('%m-%d %H:%M')
                print('   ', n, '| pts', len(v), 'future', len(fut), '| first', f(v[0]) if v else '-', 'last', f(v[-1]) if v else '-', '| sample', [(f(x), round(x[1])) for x in fut[:6:2]], '| version-date', d.get('version-date'), d.get('date-version-type'))
              except Exception as e:
                print('   ', n, 'error', e)
          print('== versions endpoint for COT RFC-VERSIONED (if any)')
          try:
            d = get('https://cwms-data.usace.army.mil/cwms-data/timeseries?office=NWDP&unit=EN&name=COT.Flow-In.Inst.~6Hours.0.RFC-VERSIONED-FCST&begin=%s&end=%s' % ((now - datetime.timedelta(days=1)).strftime('%Y-%m-%dT%H:%M:%SZ'), (now + datetime.timedelta(days=12)).strftime('%Y-%m-%dT%H:%M:%SZ')))
            print({k: d.get(k) for k in ('version-date','date-version-type','total')})
          except Exception as e: print('err', e)
          PY
