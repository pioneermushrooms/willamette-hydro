name: Probe inflow forecasts (temporary)

# Round 3: run scripts/fetch-inflow-fcst.js against NWRFC (debug rows + parsed output). Dev branch only.
on:
  push:
    branches: [claude/hourly-pool-data-retrieval-1m4bt8]
    paths: ['.github/workflows/probe-fcst.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Raw rows
        run: node scripts/fetch-inflow-fcst.js --debug
      - name: Parsed (all projects)
        run: node scripts/fetch-inflow-fcst.js --stdout | python3 -c "import json,sys; d=json.load(sys.stdin); print('errors', d['errors']); [print(k, v['lid'], v['name'], v['issued'], 'obs', len(v['obs']), v['obs'][-1:], 'fcst', len(v['fcst']), v['fcst'][:2], v['fcst'][-1:]) for k, v in d['projects'].items()]" || node scripts/fetch-inflow-fcst.js --stdout | head -c 3000
