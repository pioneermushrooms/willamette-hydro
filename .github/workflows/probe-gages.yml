name: Probe outflow vs below-dam gages (temporary)

# Diagnostic: for every project, compare USACE CWMS outflow with the USGS gage below the dam over the
# last 24 h: newest timestamps (posting lag) and how closely the values track. Dev branch only.
on:
  push:
    branches: [claude/hourly-pool-data-retrieval-1m4bt8]
    paths: ['.github/workflows/probe-gages.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime, statistics
          now = datetime.datetime.now(datetime.UTC)
          B = (now - datetime.timedelta(hours=24)).strftime('%Y-%m-%dT%H:%M:%SZ'); E = now.strftime('%Y-%m-%dT%H:%M:%SZ')
          P = [('HCR','HCR.Flow-Out.Ave.1Hour.1Hour.CBT-REV','14145500'), ('LOP','LOP.Flow-Out.Ave.1Hour.1Hour.CBT-REV',None),
               ('DEX','DEX.Flow-Out.Inst.0.0.MIXED-COMPUTED-REV','14150000'), ('FAL','FAL.Flow-Out.Inst.0.0.MIXED-COMPUTED-REV','14151000'),
               ('COT','COT.Flow-Out.Inst.0.0.MIXED-COMPUTED-REV','14153500'), ('DOR','DOR.Flow-Out.Inst.0.0.MIXED-COMPUTED-REV','14155500'),
               ('CGR','CGR.Flow-Out.Inst.0.0.MIXED-COMPUTED-REV','14159500'), ('BLU','BLU.Flow-Out.Inst.0.0.MIXED-COMPUTED-REV','14162200'),
               ('GPR','GPR.Flow-Out.Inst.0.0.MIXED-COMPUTED-REV',None), ('FRN','FRN.Flow-Out.Inst.0.0.MIXED-COMPUTED-REV','14169000')]
          def get(url, hdr=None):
            r = urllib.request.Request(url, headers=hdr or {'User-Agent': 'probe'})
            return json.load(urllib.request.urlopen(r, timeout=40))
          sites = ','.join(s for _,_,s in P if s)
          u = get('https://waterservices.usgs.gov/nwis/iv/?format=json&parameterCd=00060&period=PT24H&siteStatus=all&sites=' + sites)
          G = {}
          for ts in u['value']['timeSeries']:
            v = [(datetime.datetime.fromisoformat(x['dateTime']).astimezone(datetime.UTC), float(x['value'])) for x in ts['values'][0]['value'] if float(x['value']) > -999]
            G[ts['sourceInfo']['siteCode'][0]['value']] = v
          print('now', E)
          for code, name, site in P:
            try:
              d = get('https://cwms-data.usace.army.mil/cwms-data/timeseries?office=NWDP&unit=EN&page-size=5000&begin=%s&end=%s&name=%s' % (B, E, name), {'Accept': 'application/json;version=2'})
              c = [(datetime.datetime.fromtimestamp(x[0]/1000, datetime.UTC), x[1]) for x in d.get('values', []) if x[1] is not None]
            except Exception as e:
              print(code, 'CWMS error', e); continue
            line = '%s  CWMS %-45s n=%3d newest %s (%4.0f min old) %s' % (code, name, len(c), c[-1][0].strftime('%H:%M') if c else '-', (now - c[-1][0]).total_seconds()/60 if c else -1, round(c[-1][1]) if c else '-')
            if site and site in G and G[site]:
              g = G[site]
              line += '\n     USGS %s n=%3d newest %s (%4.0f min old) %s' % (site, len(g), g[-1][0].strftime('%H:%M'), (now - g[-1][0]).total_seconds()/60, round(g[-1][1]))
              # compare CWMS value with the gage at the same timestamps (nearest within 7 min)
              diffs = []
              for t, v in c:
                near = min(g, key=lambda x: abs((x[0]-t).total_seconds()))
                if abs((near[0]-t).total_seconds()) <= 420: diffs.append((v, near[1]))
              if diffs:
                rel = [abs(a-b)/max(b,1) for a,b in diffs]
                line += '\n     same-time pairs %d: median |diff| %.1f%%, max %.1f%%; CWMS-gage median %+.0f cfs' % (len(diffs), statistics.median(rel)*100, max(rel)*100, statistics.median([a-b for a,b in diffs]))
                # lag: shift gage by k*15 min and see best match
                best = None
                for k in range(-8, 9):
                  sh = datetime.timedelta(minutes=15*k); e = []
                  for t, v in c:
                    near = min(g, key=lambda x: abs((x[0]-(t+sh)).total_seconds()))
                    if abs((near[0]-(t+sh)).total_seconds()) <= 420: e.append(abs(v-near[1]))
                  if e and (best is None or statistics.mean(e) < best[1]): best = (k*15, statistics.mean(e))
                line += '; best alignment at gage %+d min (mean |diff| %.0f cfs)' % best
              rng = (min(x[1] for x in g), max(x[1] for x in g)); line += '; gage 24h range %d-%d' % rng
            print(line)
          PY
